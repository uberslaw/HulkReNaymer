name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/HulkReNaymer.Tests/HulkReNaymer.Tests.csproj --nologo

  wpf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build src/HulkReNaymer.App/HulkReNaymer.App.csproj -c Release --nologo

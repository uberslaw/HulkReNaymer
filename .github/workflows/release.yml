name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install Inno Setup
        run: choco install innosetup --version 6.7.1 --no-progress -y
      - name: Build installer and portable zip
        shell: pwsh
        run: ./scripts/build-windows.ps1 -RequireInstaller
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/HulkReNaymer-Setup.exe
            artifacts/HulkReNaymer-portable-win-x64.zip
